# The offline feedback loop, on every pull request (and by hand). Needs no
# secrets: the tests run on the synthetic fixture (test/fixtures/).
# Not on the push to main: a landed PR's tree is the one its PR run verified
# (harness-pr land --catch-up). Runs on the self-hosted runner on Ryan's Mac
# (a Linux container, no host folders mounted), which costs no Actions minutes.
name: check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, linux, harness-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # ruff only: the tests need none of requirements.txt (the Google libraries)
      - run: pip install -q ruff==0.16.5
      - run: make check
