# The offline feedback loop, on every push and pull request. Needs no
# secrets: the tests run on the synthetic fixture (test/fixtures/).
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # ruff only: the tests need none of requirements.txt (the Google libraries)
      - run: pip install -q ruff==0.16.5
      - run: make check
