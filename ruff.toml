# `make lint` runs ruff from .venv (requirements-dev.txt) or from PATH; it is
# advisory, not part of `make check`.
line-length = 100
target-version = "py310"
exclude = ["appsscript", "node_modules", "data", "backups", ".venv"]

[lint]
select = ["E", "F", "W"]
# E501 long lines, E731 lambda assignment and E741 short names are tolerated
# in the older scripts; F-class findings (unused imports, undefined names) are not.
ignore = ["E501", "E731", "E741"]
